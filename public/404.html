<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>404 · renown</title>
    <style>
      /* Same inline theme variables as the homepage so the 404 page matches the
         active theme without a flash of incorrect colors. Light doubles as the
         `:root` fallback for engines that never run the script below. */
      :root {
        --color-bg: #fafafa;
        --color-text-primary: #1a1a1a;
        --color-text-secondary: #4d4d4d;
        --color-text-dim: #6b6b6b;
      }

      [data-theme='dark'] {
        --color-bg: #121212;
        --color-text-primary: #f5f5f5;
        --color-text-secondary: #b3b3b3;
        --color-text-dim: #8a8a8a;
      }

      html,
      body {
        background: var(--color-bg);
        color: var(--color-text-primary);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        line-height: 1.65;
        text-align: center;
        transition: background-color 160ms ease, color 160ms ease;
      }

      main {
        padding: 2rem;
      }

      .code {
        margin: 0;
        font-size: 4rem;
        font-weight: 700;
        line-height: 1.2;
      }

      .sub {
        max-width: 36ch;
        margin: 0.5rem auto 0;
        color: var(--color-text-secondary);
      }

      a {
        color: var(--color-text-primary);
        text-decoration-color: var(--color-text-dim);
        text-underline-offset: 0.25rem;
      }

      a:hover {
        color: var(--color-text-secondary);
      }

      @media (prefers-reduced-motion: reduce) {
        body {
          transition: none;
        }
      }
    </style>
    <script>
      // Same theme logic as the homepage: apply the system theme before paint and
      // keep the theme-color meta in sync with the background.
      (() => {
        const mq = window.matchMedia('(prefers-color-scheme: dark)')
        const apply = () => {
          document.documentElement.dataset.theme = mq.matches ? 'dark' : 'light'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--color-bg').trim()
        }
        apply()
        mq.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <p class="sub">Nothing here. I only make things for my own use, and this page wasn't one of them.</p>
      <p><a href="/">Go home</a></p>
    </main>
  </body>
</html>
