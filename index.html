<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The personal site of renowned, with projects, socials, and hobbies" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>renown</title>
    <script>
      // Apply the saved theme (or system preference) before paint to avoid a color flash.
      (() => {
        const saved = localStorage.getItem('renown-theme')
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
