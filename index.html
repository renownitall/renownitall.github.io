<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The personal site of renowned, with projects, socials, and hobbies" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>renown</title>
    <style>
      /* Inlined theme variables to prevent flash of incorrect colors before the
         bundled CSS loads. The inline <script> below sets data-theme, and these
         rules immediately resolve the CSS custom properties. */
      [data-theme='dark'] {
        --color-bg: #121212;
        --color-bg-alt: #1e1e1e;
        --color-text-primary: #f5f5f5;
        --color-text-secondary: #b3b3b3;
        --color-text-dim: #8a8a8a;
        --color-divider: #3a3a3a;
      }

      [data-theme='light'] {
        --color-bg: #fafafa;
        --color-bg-alt: #f0f0f0;
        --color-text-primary: #1a1a1a;
        --color-text-secondary: #4d4d4d;
        --color-text-dim: #6b6b6b;
        --color-divider: #d0d0d0;
      }

      html, body {
        background: var(--color-bg);
        color: var(--color-text-primary);
      }
    </style>
    <script>
      // Apply the saved theme (or system preference) before paint to avoid a color flash.
      (() => {
        const saved = localStorage.getItem('renown-theme')
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
